<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" />
      <stop offset="100%" stop-color="#C25E1F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#hpBg)" />
  
  <!-- Inner White Emblem with subtle shadow -->
  <g filter="url(#shadow)" fill="#FAF8F5">
    <!-- Main Center Paw Pad with Heart Silhouette inside -->
    <path d="M256,220 C205,220 175,265 175,315 C175,370 220,405 256,425 C292,405 337,370 337,315 C337,265 307,220 256,220 Z" />
    
    <!-- Top-Left Toe Pad -->
    <ellipse cx="160" cy="180" rx="36" ry="50" transform="rotate(-20 160 180)" />
    
    <!-- Top-Center-Left Toe Pad -->
    <ellipse cx="225" cy="140" rx="34" ry="52" transform="rotate(-6 225 140)" />
    
    <!-- Top-Center-Right Toe Pad -->
    <ellipse cx="287" cy="140" rx="34" ry="52" transform="rotate(6 287 140)" />
    
    <!-- Top-Right Toe Pad -->
    <ellipse cx="352" cy="180" rx="36" ry="50" transform="rotate(20 352 180)" />
    
    <!-- Veterinary Cross Subtle Accent in Warm Terracotta inside the main pad -->
    <path d="M256,290 L256,345 M230,317 L282,317" stroke="#D97736" stroke-width="14" stroke-linecap="round" fill="none" />
  </g>
</svg>
